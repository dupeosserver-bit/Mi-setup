# Instalador de Windows (.exe NSIS). Antes: `pnpm branding` para generar build/icon.ico.
appId: net.mexicanland.misetup
productName: Mi Setup
copyright: MexicanLand
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - static/**/*
  - package.json
# La terminal de la PC (node-pty) trae binarios nativos: van fuera del asar.
asarUnpack:
  - "**/node_modules/@lydell/**"
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Mi Setup
  # Nombre sin espacios: el actualizador lo pide así a tu servidor.
  artifactName: MiSetup-${version}.${ext}
# Actualizaciones automáticas: la app busca latest.yml en las descargas de tu servidor
# (main.ts cambia la dirección si usas otro servidor). Sube a /opt/mi-setup/descargas:
# MiSetup-<versión>.exe, MiSetup-<versión>.exe.blockmap y latest.yml.
publish:
  - provider: generic
    url: https://setup.mexicanland.net/api/descargas/
