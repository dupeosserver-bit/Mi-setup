# Mi Setup — despliegue en el VPS.
# El script del VPS ejecuta:
#   docker compose --env-file /opt/mi-setup/.env up -d --build --remove-orphans
# Solo Caddy publica puertos (80/443). Postgres, core y ntfy viven en redes internas.
#
# Varias instalaciones en el mismo VPS (personal, pública, pruebas): esta es la
# principal (Caddy, ntfy, Ollama y ClamAV). Las demás solo encienden su base y su
# core con deploy/compose.instancia.yml y llegan a lo compartido por la red
# «misetup-compartida». Ver deploy/crear-instancia.sh.

name: mi-setup

# Los registros de cada contenedor se cortan en 3 archivos de 10 MB para no llenar el disco.
x-registros: &registros
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  misetup-db:
    <<: *registros
    image: postgres:16-alpine
    container_name: ${MISETUP_PREFIJO:-misetup}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-misetup}
      POSTGRES_DB: ${POSTGRES_DB:-misetup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta configurar POSTGRES_PASSWORD}
    volumes:
      - misetup_pgdata:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  core:
    <<: *registros
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        EDICION: ${EDICION:-personal}
    container_name: ${MISETUP_PREFIJO:-misetup}-core
    restart: unless-stopped
    depends_on:
      misetup-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOMAIN: ${DOMAIN:-mexicanland.net}
      APP_HOST: ${APP_HOST:-setup.mexicanland.net}
      NTFY_HOST: ${NTFY_HOST:-ntfy.mexicanland.net}
      RD_HOST: ${RD_HOST:-rd.mexicanland.net}
      RD_PUBLIC_KEY: ${RD_PUBLIC_KEY:-}
      POSTGRES_HOST: misetup-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-misetup}
      POSTGRES_DB: ${POSTGRES_DB:-misetup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta configurar POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta configurar JWT_SECRET}
      SERVER_ENC_KEY: ${SERVER_ENC_KEY:?Falta configurar SERVER_ENC_KEY}
      MAIL_INBOUND_SECRET: ${MAIL_INBOUND_SECRET:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_URL: ${NTFY_URL_INTERNA:-http://ntfy}
      BACKUP_DIR: /data/respaldos
      DESCARGAS_DIR: /data/descargas
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-10}
      # IA gratis local (servicio ollama de abajo). Vacío = desactivada.
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      PTERO_URL: ${PTERO_URL:-https://panel.mexicanland.org}
      PTERO_CLIENT_KEY: ${PTERO_CLIENT_KEY:-}
      PTERO_APP_KEY: ${PTERO_APP_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_COSTO_PUBLICAR_USD: ${X_COSTO_PUBLICAR_USD:-0.01}
      X_COSTO_LECTURA_USD: ${X_COSTO_LECTURA_USD:-0.005}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
      BANXICO_TOKEN: ${BANXICO_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      MERCADOLIBRE_CLIENT_ID: ${MERCADOLIBRE_CLIENT_ID:-}
      MERCADOLIBRE_CLIENT_SECRET: ${MERCADOLIBRE_CLIENT_SECRET:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      # Antivirus para lo que sube la comunidad del sitio oficial (servicio clamav de abajo).
      CLAMAV_HOST: ${CLAMAV_HOST:-misetup-clamav}
      CLAMAV_PORT: "3310"
    volumes:
      - misetup_uploads:/data/uploads
      # Archivos privados: compartidos por enlace, música y videos (no se sirven sin permiso).
      - misetup_archivos:/data/archivos
      # Respaldos diarios de la base que hace el script del VPS (solo lectura).
      - ${BACKUP_HOST_DIR:-/opt/mi-setup/backups}:/data/respaldos:ro
      # Apps para descargar (APK y EXE), subidas por SFTP; solo lectura para core.
      - ${DESCARGAS_HOST_DIR:-/opt/mi-setup/descargas}:/data/descargas:ro
    networks:
      - datos
      - web

  ntfy:
    <<: *registros
    image: binwiederhier/ntfy:v2.11.0
    container_name: ${MISETUP_PREFIJO:-misetup}-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: https://${NTFY_HOST:-ntfy.mexicanland.net}
      NTFY_BEHIND_PROXY: "true"
      NTFY_LISTEN_HTTP: ":80"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ENABLE_LOGIN: "false"
      NTFY_WEB_ROOT: disable
    volumes:
      - misetup_ntfy:/var/cache/ntfy
    networks:
      - web
      - compartida

  # IA gratuita local (Llama con Ollama). Opcional: se enciende con
  # COMPOSE_PROFILES=ia-local y OLLAMA_URL=http://misetup-ollama:11434 en el .env.
  # Luego descarga el modelo: docker exec misetup-ollama ollama pull llama3.2:3b
  # No publica puertos: solo core lo alcanza por la red interna "web".
  ollama:
    <<: *registros
    image: ollama/ollama:0.6.8
    container_name: ${MISETUP_PREFIJO:-misetup}-ollama
    restart: unless-stopped
    profiles: ["ia-local"]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - misetup_ollama:/root/.ollama
    networks:
      - web
      - compartida

  # Antivirus ClamAV: revisa cada .zip (y cada repositorio de GitHub) que sube la
  # comunidad del sitio oficial antes de que lo apruebes. Usa ~1 GB de RAM, por eso
  # es opcional: se enciende con COMPOSE_PROFILES=comunidad en el .env.
  # Sin él, los proyectos quedan «sin revisar» y no se pueden aprobar.
  clamav:
    <<: *registros
    image: clamav/clamav:1.4
    container_name: ${MISETUP_PREFIJO:-misetup}-clamav
    restart: unless-stopped
    profiles: ["comunidad"]
    volumes:
      - misetup_clamav:/var/lib/clamav
    networks:
      - web
      - compartida

  caddy:
    <<: *registros
    image: caddy:2-alpine
    container_name: ${MISETUP_PREFIJO:-misetup}-caddy
    restart: unless-stopped
    depends_on:
      - core
      - ntfy
    # Permite que Caddy llegue a servicios del propio VPS (host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_HOST: ${APP_HOST:-setup.mexicanland.net}
      NTFY_HOST: ${NTFY_HOST:-ntfy.mexicanland.net}
      # Por nombre de contenedor: en la red compartida hay varios «core».
      CORE_DESTINO: ${MISETUP_PREFIJO:-misetup}-core:3000
      NTFY_DESTINO: ${MISETUP_PREFIJO:-misetup}-ntfy:80
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Sitios extra (p. ej. panel de Pterodactyl): archivos *.caddy fuera de la app.
      - ${CADDY_SITIOS_DIR:-/opt/mi-setup/caddy}:/etc/caddy/sitios:ro
      - misetup_caddy_data:/data
      - misetup_caddy_config:/config
    networks:
      - web
      - compartida

networks:
  # Red sin salida a internet: solo core y la base de datos.
  datos:
    internal: true
  web: {}
  # Caddy, ntfy, Ollama y ClamAV de esta instalación, para las demás del mismo VPS.
  compartida:
    name: misetup-compartida

volumes:
  misetup_pgdata:
  misetup_uploads:
  misetup_archivos:
  misetup_ntfy:
  misetup_caddy_data:
  misetup_caddy_config:
  misetup_ollama:
  misetup_clamav:
