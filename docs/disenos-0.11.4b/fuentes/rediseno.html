<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala de control · Mi Setup (maqueta)</title>
<!--
  =============================================================================
  MAQUETA DE TODA LA APP — Mi Setup con la Terminal Pro integrada
  =============================================================================
  Es una REFERENCIA de diseño (no se conecta a nada). Muestra cómo encaja la
  terminal nueva con el resto de la app y cómo se pasan datos entre apartados.

  CÓMO SE CONECTA (lo importante para pasarlo a la app real):
  · Ajustes → Terminal: tema, fuente y tamaño. La terminal SOLO lee esto; dentro
    de la terminal únicamente hay un botón «Apariencia» que lleva aquí.
  · VPS → Comandos guardados: lo que se guarda aquí aparece en la terminal al
    escribir /nombre y en su panel «Comandos».
  · VPS → Archivos: «Abrir terminal aquí» abre una pestaña y hace cd a esa carpeta.
    El botón «SFTP» de la terminal lleva a Archivos con ese servidor.
  · VPS → Rendimiento e Inicio: «Abrir terminal» abre ese servidor directamente.
  · Ajustes → Apariencia: letras más legibles y transparencia aplican a TODA la app.

  TAMAÑOS (probar siempre vertical y acostado):
  · PC (≥ 1200 px): menú lateral completo (240 px) + contenido.
  · Tablet (641–1199 px): menú solo con íconos (68 px). Se abre completo encima.
  · Celular (≤ 640 px): barra de arriba con ☰, título, estado y buscar; el menú
    es un cajón.
  · En la terminal (en todos los tamaños) el botón flotante de la IA se esconde
    para no tapar «Enviar»; la IA se abre con el botón «IA» de la barra.
  · La terminal usa «container queries»: se acomoda al espacio que le deja el
    menú, no al ancho de toda la pantalla.

  Colores y letras: los de Mi Setup (fondo #0b0a10, paneles #13111c, acento
  lavanda #b497ff, Inter para la interfaz, JetBrains Mono para la terminal).
  Íconos: Lucide (los mismos de la app).
  =============================================================================
-->
<style>
  :root {
    --fondo: #0b0a10; --panel: #13111c; --panel-2: #191624; --panel-3: #221e31;
    --borde: rgba(255,255,255,.07); --borde-fuerte: rgba(255,255,255,.12);
    --texto: #ecebf5; --tenue: #9a96b0; --apagado: #625e77;
    --acento: #b497ff; --acento-suave: rgba(180,151,255,.14);
    --ok: #3ddc84; --aviso: #f5c451; --peligro: #ff6b81;
    --term-fondo: #121212; --term-texto: #F2F2F7; --term-cursor: #E5E5EA; --term-letra: 14px;
    --term-fuente: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
    --barra-alto: 52px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font: 13px/1.45 var(--ui); overflow: hidden; }
  body { background: radial-gradient(1200px 600px at 70% -10%, rgba(180,151,255,.10), transparent 60%), var(--fondo); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--acento); text-decoration: none; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }

  /* ================================================================ estructura */
  .app { height: 100dvh; display: grid; grid-template-columns: 240px minmax(0,1fr); grid-template-rows: var(--barra-alto) minmax(0,1fr); }
  .app.compacto { grid-template-columns: 68px minmax(0,1fr); }
  .marca { grid-row: 1; grid-column: 1; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-right: 1px solid var(--borde); border-bottom: 1px solid var(--borde); background: var(--panel); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .marca .logo { width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(from 200deg, #ff6fb5, #b497ff, #7dd3fc, #5be39e, #ff6fb5); display: grid; place-items: center; color: #111; font-weight: 800; flex: none; }
  .superior { grid-row: 1; grid-column: 2; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--borde); background: color-mix(in srgb, var(--panel) 85%, transparent); }
  .superior .titulo-movil { display: none; font-weight: 600; font-size: 16px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .superior .espacio { flex: 1; }
  .conectado { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 600; font-size: 12px; }
  .usuario { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #3a3350, #6b5f8a); display: grid; place-items: center; font-size: 11px; }

  /* ================================================================ menú lateral */
  .menu { grid-row: 2; grid-column: 1; background: var(--panel); border-right: 1px solid var(--borde); display: flex; flex-direction: column; min-height: 0; }
  .menu nav { flex: 1; overflow-y: auto; padding: 8px; }
  .cat { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--apagado); padding: 14px 10px 6px; white-space: nowrap; }
  .item-menu { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--tenue); text-align: left; white-space: nowrap; }
  .item-menu .ic { width: 17px; height: 17px; }
  .item-menu span { overflow: hidden; text-overflow: ellipsis; }
  .item-menu:hover { background: var(--panel-3); color: var(--texto); }
  .item-menu.activo { background: var(--acento); color: #15121f; font-weight: 600; }
  .pie-menu { border-top: 1px solid var(--borde); padding: 8px; }
  .app.compacto .cat { font-size: 0; padding: 8px 0 2px; border-top: 1px solid var(--borde); margin: 6px 8px 0; }
  .app.compacto .item-menu { justify-content: center; padding: 0; }
  .app.compacto .item-menu span, .app.compacto .marca .nombre-app { display: none; }
  .app.compacto .marca { padding: 0; justify-content: center; }
  .velo { display: none; position: fixed; inset: 0; background: rgba(5,4,9,.55); z-index: 40; }
  .velo.ver { display: block; }

  /* ================================================================ contenido */
  .contenido { grid-row: 2; grid-column: 2; overflow-y: auto; min-height: 0; position: relative; }
  .pagina { max-width: 1440px; margin: 0 auto; padding: 28px 28px 90px; }
  .pagina.completa { max-width: none; height: 100%; padding: 16px; display: flex; flex-direction: column; }
  .encabezado { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .encabezado h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .encabezado p { margin: 2px 0 0; color: var(--tenue); }
  .encabezado .der { margin-left: auto; display: flex; gap: 8px; }
  .ayuda { position: absolute; right: 24px; top: 14px; color: var(--tenue); display: inline-flex; gap: 6px; align-items: center; font-size: 12px; background: none; border: 0; }
  .tarjeta { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--borde); border-radius: 16px; padding: 16px; }
  .tarjeta h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .rejilla { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .fila-dato { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--borde); margin-bottom: 8px; }
  .fila-dato .izq { display: flex; align-items: center; gap: 10px; color: var(--texto); font-weight: 600; }
  .fila-dato .der { color: var(--tenue); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pestanas-pag { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--panel); border: 1px solid var(--borde); overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; }
  .pestanas-pag button { flex: none; height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: transparent; color: var(--tenue); font-weight: 500; }
  .pestanas-pag button.activo { background: var(--panel-3); color: var(--texto); font-weight: 600; }
  .vacio { text-align: center; color: var(--tenue); padding: 40px 16px; }
  .vacio .ic { width: 34px; height: 34px; color: var(--acento); }

  /* ================================================================ botones y campos */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--tenue); white-space: nowrap; transition: background .12s, color .12s; }
  .btn:hover { background: var(--panel-3); color: var(--texto); }
  .btn.primario { background: var(--acento); color: #15121f; font-weight: 600; }
  .btn.primario:hover { background: #c4adff; }
  .btn.borde { border-color: var(--borde-fuerte); color: var(--texto); background: var(--panel-2); }
  .btn.activo { background: var(--acento-suave); color: var(--acento); }
  .btn.icono { width: 34px; padding: 0; }
  .btn.chico { height: 30px; padding: 0 10px; }
  .btn.peligro { background: var(--peligro); color: #1b0a0f; font-weight: 600; }
  .kbd { font: 11px var(--mono); color: var(--apagado); border: 1px solid var(--borde-fuerte); border-radius: 5px; padding: 0 5px; }
  .campo { display: block; margin-bottom: 14px; }
  .campo > span { display: block; font-size: 12px; font-weight: 600; color: var(--tenue); margin-bottom: 6px; }
  .entrada { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--borde-fuerte); background: var(--panel-2); padding: 0 12px; outline: 0; }
  .entrada:focus { border-color: var(--acento); }
  input[type=range] { width: 100%; accent-color: var(--acento); }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--apagado); flex: none; display: inline-block; }
  .punto.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,132,.15); }
  .punto.aviso { background: var(--aviso); }
  .etiqueta { font-size: 10px; padding: 1px 7px; border-radius: 99px; background: var(--panel-3); color: var(--tenue); }
  .flotante { position: fixed; right: 20px; bottom: 20px; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--acento); color: #15121f; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(180,151,255,.35); z-index: 20; }
  .flotante .ic { width: 22px; height: 22px; }
  /* En la terminal el botón flotante de la IA taparía «Enviar»: ahí la IA va en la barra de la terminal. */
  .app.en-terminal .flotante { display: none; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--panel-3); border: 1px solid var(--borde-fuerte); padding: 10px 14px; border-radius: 10px; transition: .2s; pointer-events: none; z-index: 90; box-shadow: 0 12px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); }
  .toast.ver { opacity: 1; transform: translate(-50%, 0); }
  .fondo-modal { position: fixed; inset: 0; background: rgba(5,4,9,.7); display: none; place-items: center; z-index: 80; padding: 16px; }
  .fondo-modal.ver { display: grid; }
  .modal { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 16px; padding: 18px; }
  .modal h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .modal p { color: var(--tenue); margin: 0 0 12px; }
  .modal pre { background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 10px; font: 12px var(--mono); color: var(--peligro); white-space: pre-wrap; }
  .modal .fila-btn { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  /* ================================================================ inicio / rendimiento / archivos */
  .medidor { height: 8px; border-radius: 99px; background: var(--panel-3); overflow: hidden; margin-top: 8px; }
  .medidor i { display: block; height: 100%; border-radius: 99px; background: var(--acento); }
  .grande { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .barras { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 12px; }
  .barras i { flex: 1; border-radius: 4px 4px 0 0; background: linear-gradient(var(--acento), rgba(180,151,255,.35)); min-height: 4px; }
  .rejilla > * { min-width: 0; }
  .acceso { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--borde); background: var(--panel-2); color: var(--texto); font-weight: 500; }
  .acceso:hover { border-color: var(--borde-fuerte); }
  .tabla { width: 100%; border-collapse: collapse; }
  .tabla td, .tabla th { padding: 10px 12px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
  .tabla th { color: var(--apagado); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .tabla tr:hover td { background: var(--panel-2); }
  .tabla .nom { display: flex; align-items: center; gap: 10px; color: var(--texto); }
  .ruta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; font: 12px var(--mono); }
  .ruta button { border: 0; background: var(--panel-2); border-radius: 7px; padding: 4px 8px; color: var(--tenue); }
  .ruta button:last-child { color: var(--texto); }
  .desliza-x { overflow-x: auto; }

  /* ================================================================ ajustes → terminal */
  .temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tema { border: 1px solid var(--borde); border-radius: 12px; background: var(--panel-2); padding: 8px; text-align: left; }
  .tema.sel { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
  .tema .mini { border-radius: 7px; padding: 6px 8px; font: 11px var(--mono); margin-bottom: 6px; }
  .tema b { font-size: 12px; }
  .previa { border-radius: 12px; padding: 14px; font-family: var(--term-fuente); font-size: var(--term-letra); background: var(--term-fondo); color: var(--term-texto); line-height: 1.55; white-space: pre-wrap; }
  .dos-col { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 14px; }

  /* ================================================================ TERMINAL PRO */
  .term { flex: 1; min-height: 0; container-type: inline-size; container-name: term; }
  .term-caja { height: 100%; display: grid; grid-template-columns: 250px minmax(0,1fr) 290px; border: 1px solid var(--borde); border-radius: 16px; overflow: hidden; background: var(--panel); position: relative; }
  .term-caja.sin-panel { grid-template-columns: 250px minmax(0,1fr); }
  .term-caja.sin-panel .t-lateral { display: none; }
  .t-hosts { border-right: 1px solid var(--borde); display: flex; flex-direction: column; min-height: 0; }
  .t-buscar { margin: 10px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--borde); color: var(--tenue); }
  .t-buscar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; }
  .t-lista { overflow-y: auto; padding: 0 8px 10px; flex: 1; }
  .t-grupo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--apagado); padding: 10px 8px 6px; display: flex; justify-content: space-between; }
  .t-host { display: grid; grid-template-columns: 32px 1fr auto; gap: 9px; align-items: center; padding: 7px 8px; border-radius: 10px; border: 1px solid transparent; }
  .t-host:hover, .t-host.sel { background: var(--panel-2); }
  .t-host.sel { border-color: var(--borde-fuerte); }
  .t-host .av { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--panel-3); color: var(--acento); }
  .t-host .nom { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .t-host .det { font: 11px var(--mono); color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-pie { border-top: 1px solid var(--borde); padding: 8px; display: flex; gap: 6px; }
  .t-pie .btn { flex: 1; }
  .t-centro { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .t-chips { display: none; gap: 6px; padding: 8px; overflow-x: auto; border-bottom: 1px solid var(--borde); scrollbar-width: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--borde-fuerte); background: var(--panel-2); }
  .chip.sel { border-color: var(--acento); color: var(--acento); }
  .t-pestanas { display: flex; height: 40px; border-bottom: 1px solid var(--borde); overflow-x: auto; scrollbar-width: none; flex: none; }
  .t-pestana { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-right: 1px solid var(--borde); color: var(--tenue); border-top: 2px solid transparent; min-width: 140px; max-width: 210px; cursor: pointer; }
  .t-pestana .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-pestana.activa { background: var(--term-fondo); color: var(--texto); border-top-color: var(--acento); }
  .t-pestana .x { width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--apagado); display: grid; place-items: center; padding: 0; }
  .t-pestana .x:hover { background: var(--panel-3); color: var(--texto); }
  .t-nueva { border: 0; background: transparent; color: var(--tenue); padding: 0 12px; }
  .t-barra { display: flex; align-items: center; gap: 2px; padding: 5px 6px; border-bottom: 1px solid var(--borde); overflow-x: auto; scrollbar-width: none; flex: none; }
  .t-barra .sep { width: 1px; height: 18px; background: var(--borde-fuerte); margin: 0 4px; flex: none; }
  .t-zona { flex: 1; min-height: 0; display: grid; background: var(--term-fondo); position: relative; }
  .t-zona.dividida { grid-template-columns: 1fr 1fr; }
  .t-zona.dividida .t-vista + .t-vista { border-left: 1px solid var(--borde-fuerte); }
  .t-vista { min-width: 0; min-height: 0; overflow-y: auto; padding: 12px 14px 6px; font-family: var(--term-fuente); font-size: var(--term-letra); line-height: 1.55; color: var(--term-texto); white-space: pre-wrap; overflow-wrap: anywhere; }
  .t-vista .linea { min-height: 1.55em; }
  .c-verde { color: #3ddc84; } .c-azul { color: #7cb7ff; } .c-lila { color: #b497ff; } .c-amarillo { color: #f5c451; } .c-rojo { color: #ff6b81; } .c-gris { color: #6d6984; } .c-cian { color: #6fe3e3; } .negrita { font-weight: 700; }
  .cursor { display: inline-block; width: .6em; height: 1.15em; vertical-align: -.2em; background: var(--term-cursor); animation: parpadeo 1.1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  mark { background: rgba(245,196,81,.35); color: inherit; border-radius: 2px; }
  .t-busqueda { position: absolute; top: 8px; right: 12px; display: none; align-items: center; gap: 6px; padding: 6px; background: var(--panel-2); border: 1px solid var(--borde-fuerte); border-radius: 10px; z-index: 5; }
  .t-busqueda.ver { display: flex; }
  .t-busqueda input { width: 190px; height: 28px; border-radius: 7px; border: 1px solid var(--borde); background: var(--fondo); padding: 0 8px; outline: 0; }
  .t-estado { display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px; border-top: 1px solid var(--borde); color: var(--tenue); font: 11px var(--mono); overflow-x: auto; white-space: nowrap; scrollbar-width: none; flex: none; }
  .t-estado .der { margin-left: auto; display: flex; gap: 14px; }
  .t-comando { border-top: 1px solid var(--borde); padding: 8px; position: relative; flex: none; }
  .t-teclas { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  .tecla { flex: none; min-width: 40px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--borde-fuerte); background: var(--panel-2); font: 12px var(--mono); }
  .tecla.activa { border-color: var(--acento); color: var(--acento); }
  .t-entrada { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 10px; border: 1px solid var(--borde-fuerte); background: var(--fondo); }
  .t-entrada:focus-within { border-color: var(--acento); }
  .t-entrada .p { font: 13px var(--mono); color: var(--acento); }
  .t-entrada input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 13px var(--mono); }
  .t-sug { position: absolute; left: 8px; right: 8px; bottom: calc(100% - 4px); background: var(--panel-2); border: 1px solid var(--borde-fuerte); border-radius: 10px; display: none; max-height: 220px; overflow-y: auto; padding: 4px; z-index: 6; }
  .t-sug.ver { display: block; }
  .sug { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
  .sug:hover, .sug.sel { background: var(--panel-3); }
  .sug b { font: 600 12px var(--mono); color: var(--acento); }
  .sug span { color: var(--tenue); font-size: 12px; }

const PELIGROSOS = /\b(rm\s+-rf?|mkfs|dd\s+if=|reboot|shutdown|poweroff|halt|docker\s+system\s+prune|drop\s+database)\b/i;

function respuesta(p, c) {

  if (c === "help" || c === "ayuda") return ['Prueba: <span class="c-cian">ls, df -h /, docker ps, uptime, whoami, cd /ruta, clear</span>'];

}
function dividir() { if (est.pestanas.length < 2) return avisar("Abre dos sesiones para verlas lado a lado."); est.dividida = !est.dividida; pintarPagina(); }
function codigo2fa() { const p = activa(); if (!p) return avisar("Primero abre una sesión."); p.lineas.push('<span class="c-gris">[código 2FA enviado: ••••••]</span>'); pintarTerm(); }
async function pegar() { try { $("t-entrada").value += await navigator.clipboard.readText(); $("t-entrada").focus(); } catch { avisar("Usa Ctrl+V en la caja."); } }
function copiarSalida() { const p = activa(); if (!p) return; const d = document.createElement("div"); d.innerHTML = p.lineas.join("\n"); navigator.clipboard?.writeText(d.textContent).then(() => avisar("Salida copiada"), () => avisar("No se pudo copiar")); }

// ============================================================================ arranque
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey && k === "f" && rutaActual().pag === "terminal") { e.preventDefault(); abrirBusqueda(); }
  if (e.key === "Escape") { cerrarModal(); cerrarMenu(); cerrarPanelT(); }
});
if (window.visualViewport) visualViewport.addEventListener("resize", () => { $("app").style.height = visualViewport.height + "px"; });
matchMedia("(max-width: 640px)").addEventListener("change", () => { ajustarBarra(); cerrarMenu(); });
window.addEventListener("hashchange", pintarPagina);
window.addEventListener("load", () => {
  aplicarAjustesTerminal(); aplicarLectura(); ajustarBarra();
  if (!location.hash) location.hash = "/terminal";
  pintarPagina();
});
const iconosExtra = (txt) => document.querySelector("svg defs").insertAdjacentHTML("beforeend", txt);
</script>
